name: shop_riverpod
description: >
  Application e-commerce Flutter avec Riverpod : catalogue de produits
  (liste + détail), panier, favoris persistés, filtrage/tri, profil mock.
  Architecture en couches, données asynchrones gérées avec AsyncValue.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/products.json
